<style>
body{background:#0b0b0b;font-family:sans-serif;margin:0;color:#fff}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;
  padding:12px;
}

/* CARD */
.card{
  width:100%;
  height:85%;
  object-position:80% center;
  aspect-ratio:3/4; 
  background:#111;
  border-radius:14px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
}

/* LABEL */
.label{position:absolute;top:5px;left:5px;background:red;padding:3px 6px;font-size:10px;font-weight:bold;border-radius:4px;}
.label.top{background:orange;}
.label.new{background:red;}

.card img{width:100%;height:90%;object-fit:contain;background:#000;}

.rtp{position:absolute;bottom:0;left:0;width:100%;height:22px;background:rgba(255,255,255,0.3);border-radius:4px;overflow:hidden;backdrop-filter:blur(4px);}
.rtp-fill{position:relative;height:100%;width:var(--percent,50%);overflow:hidden;border-radius:4px;background:none;}
.rtp-fill::before{content:"";position:absolute;top:0;left:0;width:300%;height:100%;background:linear-gradient(90deg,#22c55e 0%,#4ade80 20%,#22c55e 40%,#4ade80 60%,#22c55e 80%,#4ade80 100%);background-size:300% 100%;animation:moveForward 6s linear infinite;}
.rtp-fill.high::before{background:repeating-linear-gradient(45deg,rgba(255,255,255,0.2),rgba(255,255,255,0.2) 10px,transparent 10px,transparent 20px),linear-gradient(90deg,#22c55e,#4ade80,#22c55e);}
.rtp-fill.mid::before{background:repeating-linear-gradient(45deg,rgba(255,255,255,0.2),rgba(255,255,255,0.2) 10px,transparent 10px,transparent 20px),linear-gradient(90deg,#facc15,#fde047,#facc15);}
.rtp-fill.low::before{background:repeating-linear-gradient(45deg,rgba(255,255,255,0.2),rgba(255,255,255,0.2) 10px,transparent 10px,transparent 20px),linear-gradient(90deg,#ef4444,#f87171,#ef4444);}
@keyframes moveForward{0%{transform:translateX(0);}100%{transform:translateX(-66%);}}

.rtp-text{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;font-weight:bold;color:#000;z-index:2;pointer-events:none;text-shadow:0 0 3px #fff;}
.card .overlay-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80%;height:40px;background:rgba(223,183,5,0.9);color:#000;font-weight:bold;font-size:12px;text-align:center;line-height:40px;opacity:0;transition:opacity 0.3s ease;pointer-events:none;border-radius:6px;}
.card:hover .overlay-btn{opacity:1;pointer-events:auto;}

/* POPUP */
.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;}
.popup-content{width:92%;max-width:360px;background:#1c1c1c;border-radius:16px;overflow:hidden;position:relative;}
.popup-header{background:#dfb705;text-align:center;padding:14px;font-weight:bold;}
.popup-body{padding:14px;font-size:12px;}
.close{position:absolute;top:8px;right:8px;background:#fff;color:#000;width:25px;height:25px;border-radius:50%;text-align:center;line-height:25px;cursor:pointer;}
.info-box{background:#111;padding:10px;border-radius:8px;margin-bottom:10px;}
.info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222;}
.info-row:last-child{border-bottom:none;}
.info-label{color:#aaa;}
.info-value{font-weight:bold;}
.pola-title{text-align:center;background:#dfb705;padding:6px;font-size:11px;font-weight:bold;margin:10px 0;}
.step{background:#0f0f0f;padding:12px;border-radius:10px;margin-bottom:10px;border-left:4px solid #dfb705;}
.step b{display:block;margin-bottom:3px;}
.final-red{color:#ff2d2d;font-weight:bold;margin-top:10px;}
.green{color:#22c55e;text-align:center;margin-top:10px;font-weight:bold;}
.warning-red{background:#ef4444;color:#fff;padding:12px;border-radius:8px;text-align:center;font-size:12px;font-weight:bold;margin-bottom:10px;}
.btn{display:block;text-align:center;padding:14px;background:#dfb705;color:#fff;text-decoration:none;font-weight:bold;}
</style>

// Fungsi Hitung TimeBlock
function getTimeBlock(){
  let now=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Jakarta"}));
  let minutes=now.getMinutes();
  let block=Math.floor(minutes/15);
  return now.getHours()*4+block;
}


let rtpCache = {}; 

function getRTP(i){
  let timeBlock = getTimeBlock();

  
  let seed = (i * 53 + timeBlock * 29 + (i % 6) * 17) % 100;

  if(seed < 15){
    // 🔴 
    return 45 + (seed % 13);    
  } 
  else if(seed < 30){
    // 🟡 
    return 55 + (seed % 20);    
  } 
  else{
    // 🟢 
    return 65 + (seed % 18);   
  }
}

function getFinalStep(gameIndex){
  let timeBlock = getTimeBlock();
  let seed = (gameIndex * 11 + timeBlock * 7) % finalList.length;
  return finalList[seed];
}

// Render Game Grid
function render(list=games){
let html="";
list.forEach((g,i)=>{
  let r=getRTP(i);
  let level=r>=75?"high":r>=60?"mid":"low";
  html+=`<div class="card" onclick="openPopup(${i})">
  <img src="${g.img}">
  <div class="rtp"><div class="rtp-fill ${level}" style="width:${r}%"></div><div class="rtp-text">${r}%</div></div>
  <div class="overlay-btn" onclick="openPopup(${i}); event.stopPropagation();">Lihat Pola & Trik</div></div>`;
});
document.getElementById("grid").innerHTML=html;
}

let betCache = {}; // cache per game per blok

function getBet(i){
  let timeBlock = getTimeBlock();
  let key = `${i}_${timeBlock}`;

  // kalau sudah ada cache, pakai itu
  if(betCache[key] !== undefined) return betCache[key];

  // Pilihan minimal kelipatan 200
  let minOptions = [200, 400, 600, 800];
  let min = minOptions[Math.floor(Math.random() * minOptions.length)];

  // Pilihan maksimal (lebih besar dari min, tetap kelipatan 200)
  let maxOptions = [];
  for(let m = min + 200; m <= 1200; m += 200){
    maxOptions.push(m);
  }
  let max = maxOptions[Math.floor(Math.random() * maxOptions.length)];

  let betText = min + " - " + max;
  betCache[key] = betText;
  return betText;
}
