const INTERVAL = 15 * 60 * 500;


function generateOnlineUsers(prev){
  let hour = new Date().getHours();

  let min, max;

  // 00:00 - 03:00 (masih ramai)
  if(hour >= 0 && hour < 3){
    min = 9000;
    max = 13000;
  }

  // 03:00 - 10:00 (turun / sepi)
  else if(hour >= 3 && hour < 10){
    min = 5000;
    max = 7000;
  }

  // 10:00 - 18:00 (mulai naik)
  else if(hour >= 10 && hour < 18){
    min = 7000;
    max = 10000;
  }

  // 18:00 - 20:00 (menuju ramai)
  else if(hour >= 18 && hour < 20){
    min = 9000;
    max = 12000;
  }

  // 20:00 - 24:00 (peak)
  else{
    min = 11000;
    max = 15000;
  }

 
  if(!prev){
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

 
  let change = Math.floor(Math.random() * 300 - 150);

  let next = prev + change;

  
  if(next < min) next = min;
  if(next > max) next = max;

  return next;
}

const providerList = document.getElementById("providerList");

let autoScroll;

// DUPLIKAT BIAR LOOP HALUS
function duplicateProvider(){
  providers.forEach(p => {
    const div = document.createElement("div");
    div.className = "provider";

    div.innerHTML = `<img src="${p.img}"><span>${p.name.toUpperCase()}</span>`;

    div.onclick = () => {
      document.querySelectorAll(".provider").forEach(el => el.classList.remove("active"));
      div.classList.add("active");
      gameFrame.src = p.link;
      document.getElementById("searchGame").value = "";
    };

    providerList.appendChild(div);
  });
}

// START AUTO SCROLL
function startAutoScroll(){
  stopAutoScroll(); // reset dulu

  autoScroll = setInterval(() => {
    providerList.scrollLeft += 1;

    if(providerList.scrollLeft >= providerList.scrollWidth / 2){
      providerList.scrollLeft = 0;
    }
  }, 16); // lebih smooth
}

// STOP
function stopAutoScroll(){
  if(autoScroll) clearInterval(autoScroll);
}

// INIT MOBILE
function initMobileScroll(){
  if(window.matchMedia("(max-width: 768px)").matches){

    duplicateProvider();

    setTimeout(() => {
      startAutoScroll();
    }, 500);

    // PAUSE SAAT INTERAKSI
    providerList.addEventListener("touchstart", stopAutoScroll);
    providerList.addEventListener("touchend", startAutoScroll);

    providerList.addEventListener("mousedown", stopAutoScroll);
    providerList.addEventListener("mouseup", startAutoScroll);
  } else {
    stopAutoScroll();
  }
}

// JALANKAN SAAT LOAD
window.addEventListener("load", initMobileScroll);

// JALANKAN LAGI SAAT RESIZE (HP rotate)
window.addEventListener("resize", initMobileScroll);

let isDown = false;
let startX;
let scrollLeft;

providerList.addEventListener("mousedown", (e) => {
  isDown = true;
  startX = e.pageX - providerList.offsetLeft;
  scrollLeft = providerList.scrollLeft;
});

providerList.addEventListener("mouseleave", () => isDown = false);
providerList.addEventListener("mouseup", () => isDown = false);

providerList.addEventListener("mousemove", (e) => {
  if(!isDown) return;
  e.preventDefault();
  const x = e.pageX - providerList.offsetLeft;
  const walk = (x - startX) * 2; // speed drag
  providerList.scrollLeft = scrollLeft - walk;
});
</script>
